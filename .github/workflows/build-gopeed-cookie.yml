name: build-gopeed-cookie

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.4"
  FLUTTER_VERSION: "3.41.6"
  GOPEED_REF: "main"

jobs:
  build-windows-amd64:
    runs-on: windows-2022
    defaults:
      shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble patch from chunks
        run: |
          set -euo pipefail
          : > cookie.patch.b64
          for f in $(ls patch-parts/c*.b64 | sort); do
            tr -d '\n\r\t ' < "$f" >> cookie.patch.b64
          done
          base64 -d cookie.patch.b64 > gopeed-cookie.patch
          echo "patch bytes: $(wc -c < gopeed-cookie.patch)"
          head -3 gopeed-cookie.patch

      - name: Clone upstream gopeed
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          git clone --depth 1 --branch "$GOPEED_REF" https://github.com/GopeedLab/gopeed.git src
          git -C src log --oneline -1

      - name: Apply cookie bridge patch
        run: |
          set -euo pipefail
          cd src
          git apply --verbose ../gopeed-cookie.patch
          echo "--- userscript ---"
          ls -l ui/flutter/assets/userscript/gopeed-cookie.user.js
          echo "--- l10n keys ---"
          grep -c cookieUserscript ui/flutter/lib/l10n/app_zh.arb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Go native pieces
        working-directory: src
        run: |
          set -euo pipefail
          go build -tags nosqlite -ldflags="-w -s" -buildmode=c-shared -o ui/flutter/windows/libgopeed.dll github.com/GopeedLab/gopeed/bind/desktop
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/host.exe github.com/GopeedLab/gopeed/cmd/host
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/updater.exe github.com/GopeedLab/gopeed/cmd/updater
          ls -l ui/flutter/windows/libgopeed.dll ui/flutter/assets/exec/

      - name: Pub get and generate l10n
        working-directory: src/ui/flutter
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Analyze (non blocking)
        working-directory: src/ui/flutter
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows release
        working-directory: src/ui/flutter
        run: flutter build windows --release

      - name: Bundle runtime DLLs
        working-directory: src/ui/flutter
        run: |
          set -euo pipefail
          RELEASE="build/windows/x64/runner/Release"
          ls -l "$RELEASE"
          CC=$(go env CC)
          CC_PATH=$(command -v "$CC" || true)
          echo "cc=$CC path=$CC_PATH"
          for dll in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            p=$($CC_PATH -print-file-name=$dll)
            echo "$dll -> $p"
            cp -v "$p" "$RELEASE" || cp -v "$(dirname "$CC_PATH")/$dll" "$RELEASE"
          done
          cp -v /c/Windows/System32/msvcp140.dll "$RELEASE" || true
          cp -v /c/Windows/System32/vcruntime140.dll "$RELEASE" || true
          cp -v /c/Windows/System32/vcruntime140_1.dll "$RELEASE" || true
          ls -l "$RELEASE"

      - name: Zip portable bundle
        working-directory: src/ui/flutter
        shell: pwsh
        run: |
          New-Item -Path build/windows/Output -ItemType Directory -Force | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/windows/Output/Gopeed-CookieBridge-windows-amd64.zip" -Force
          Get-Item build/windows/Output/Gopeed-CookieBridge-windows-amd64.zip | Select-Object Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gopeed-CookieBridge-windows-amd64
          path: src/ui/flutter/build/windows/Output/Gopeed-CookieBridge-windows-amd64.zip
          if-no-files-found: error
