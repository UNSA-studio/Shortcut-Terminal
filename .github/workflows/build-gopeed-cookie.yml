name: build-gopeed-cookie

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.4"
  FLUTTER_VERSION: "3.41.6"

jobs:
  build-windows-amd64:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Go native pieces
        run: |
          go build -tags nosqlite -ldflags="-w -s" -buildmode=c-shared -o ui/flutter/windows/libgopeed.dll github.com/GopeedLab/gopeed/bind/desktop
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/host.exe github.com/GopeedLab/gopeed/cmd/host
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/updater.exe github.com/GopeedLab/gopeed/cmd/updater

      - name: Generate l10n
        working-directory: ui/flutter
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Analyze
        working-directory: ui/flutter
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows
        working-directory: ui/flutter
        run: flutter build windows --release --dart-define="UPDATE_CHANNEL=windowsPortable"

      - name: Bundle runtime DLLs
        working-directory: ui/flutter
        run: |
          $release = "build\windows\x64\runner\Release\"
          $system = "C:\Windows\System32"
          $cc = (Get-Command -Name (go env CC) -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          foreach ($dll in @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll")) {
              $runtimePath = [string](& $cc "-print-file-name=$dll")
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($runtimePath)) {
                  throw "Failed to locate $dll using $cc"
              }
              $runtimePath = $runtimePath.Trim()
              if ($runtimePath -eq $dll) {
                  $runtimePath = Join-Path (Split-Path -Parent $cc) $dll
              }
              if (!(Test-Path -LiteralPath $runtimePath -PathType Leaf)) {
                  throw "MinGW runtime $dll was not found by $cc (reported path: $runtimePath)"
              }
              Copy-Item -LiteralPath $runtimePath -Destination $release
          }
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
              Copy-Item -LiteralPath (Join-Path $system $dll) -Destination $release
          }

      - name: Package portable zip
        working-directory: ui/flutter
        run: |
          New-Item -Path build\windows\Output -ItemType Directory -Force | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\windows\Output\Gopeed-CookieBridge-windows-amd64-portable.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gopeed-CookieBridge-windows-amd64
          path: ui/flutter/build/windows/Output/Gopeed-CookieBridge-windows-amd64-portable.zip
          if-no-files-found: error
